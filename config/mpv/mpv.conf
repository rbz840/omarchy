# Omarchy ARM64 Pi 5 — mpv configuration.
# Installed to /etc/mpv/mpv.conf by install/pi/05-pi-specific.sh.
#
# Raspberry Pi 5 video decoding, honestly stated:
#   - The VideoCore VI HEVC/H.264 decoder is exposed by the linux-rpi kernel
#     through the V4L2 stateless (request) API (/dev/video19 + /dev/media*, the
#     rpivid driver).
#   - mpv's v4l2request hwdec ONLY exists if the linked FFmpeg was built with
#     the V4L2 request-API hwaccels (mainlined in FFmpeg 8.0). Neither ALARM's
#     stock ffmpeg 9.0.1 nor its mpv 0.41 enable/ship it (verified 2026-09-06
#     by scanning the released binaries), and ALARM's ffmpeg-rpi is an
#     unrelated 7.1 package for Pi 3/4/400 that no ALARM package links.
#   - Therefore the practical Pi 5 path in mpv is software decode of
#     HEVC/H.264 (the 4x A76 cores handle 1080p — and most 4K — comfortably)
#     with the GPU doing the compositing/scaling: that is what
#     hwdec=auto-safe + vo=gpu gives you. If the v4l2request hwdec ever
#     appears (ffmpeg-v4l2request from AUR, or ALARM enabling it), auto-safe
#     picks it up with no config change.

hwdec=auto-safe
vo=gpu
# Keep going when a hw decoder exists but fails init (e.g. broken ffmpeg build)
hwdec-fallback=yes
cache=yes
demuxer-max-bytes=512MiB
