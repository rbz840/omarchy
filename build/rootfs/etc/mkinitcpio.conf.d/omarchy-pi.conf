# /etc/mkinitcpio.conf.d/omarchy-pi.conf — Omarchy ARM64 (Pi 5) additions.
# Sourced by mkinitcpio after /etc/mkinitcpio.conf. Array APPEND (+=), not
# replacement, so upstream HOOKS/MODULES ordering stays authoritative.
#
# omarchy-pi-esp: waits for the boot medium (NVMe/USB) and self-repairs the
# ESP (cmdline.txt / config.txt) from pristine copies embedded in the
# initramfs. See /usr/lib/initcpio/hooks/omarchy-pi-esp for behavior.

HOOKS+=(omarchy-pi-esp)

# autodetect tunes the initramfs to the machine RUNNING mkinitcpio — during
# image assembly that is a build container (CI runner hardware), not the Pi.
# Left in, it strips the SD/NVMe/USB drivers the image needs on real hardware.
# Remove it so block/filesystems hooks include everything for SD, USB and
# NVMe regardless of what the builder happens to expose.
_omarchy_hooks=()
for _h in "${HOOKS[@]}"; do
    [[ "$_h" == autodetect ]] || _omarchy_hooks+=("$_h")
done
HOOKS=("${_omarchy_hooks[@]}")
unset _omarchy_hooks _h

# Force-include drivers the image must have in early userspace — but ONLY
# those that actually exist in the installed kernel tree(s). linux-rpi has NO
# virtio support (Pi hardware has none), and force-adding an absent module
# fails the whole mkinitcpio build (observed 2026-09-06, CI run 34048432400:
# "module not found: 'virtio_pci'").
#   ext4        root filesystem (SD/USB/NVMe all use it here)
#   nvme        NVMe boot medium
#   mmc_block   SD/eMMC block layer
#   usb_storage USB boot (real Pi USB path + QEMU usb-storage test disk)
#   xhci_pci    USB host controller (Pi 5 VL805 / QEMU qemu-xhci)
for _m in ext4 nvme mmc_block usb_storage xhci_pci; do
    find /usr/lib/modules -name "${_m}.ko*" -print -quit 2>/dev/null | grep -q . \
        && MODULES+=("$_m")
done
unset _m

# Host-controller and bridge drivers vary by Pi generation — add every
# sdhci* (SD hosts) and PCIe brcmstb (NVMe bridge on Pi 5) module present in
# the tree, existence-checked like above.
for _f in $(find /usr/lib/modules \( -name 'sdhci*.ko*' -o -name 'pcie*brcmstb*.ko*' \) 2>/dev/null); do
    _b="$(basename "$_f")"
    _b="${_b%%.ko*}"
    MODULES+=("$_b")
done
unset _f _b
