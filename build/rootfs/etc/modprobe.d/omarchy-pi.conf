# Omarchy ARM64 Pi 5 — module configuration.
# The legacy framebuffer driver must not grab the display before vc4 KMS;
# linux-rpi ships both, blacklist the legacy one.

blacklist vc4-fkms-v3d
blacklist bcm2835_v4l2
blacklist bcm2835_isp
blacklist bcm2835_codec

# No legacy x86 Intel/AMD audio stacks expected; harmless to blacklist explicitly.
blacklist snd_hda_intel
blacklist snd_intel_dspcfg
blacklist snd_sof_pci_intel_tgl

# Bluetooth firmware load fix (CYW43455) — hci_uart handles it; disable btusb to avoid races.
# (Keep this line commented if you attach a USB BT dongle.)
# blacklist btusb
