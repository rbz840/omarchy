# Omarchy ARM64 Pi 5 — NetworkManager defaults
# Wired (eth0, bcmgenet) up by default; WiFi (wlan0, brcmfmac CYW43455) managed
# by NM; avahi mDNS on; keep BT PAN off by default.

[main]
plugins=ifupdown,keyfile
dns=systemd-resolved

[device]
wifi.scan-rand-mac-address=yes

[device-wlan0]
match-device=interface-name:wlan0
managed=1

[device-eth0]
match-device=interface-name:eth0
managed=1

[connection]
wifi.powersave=2
