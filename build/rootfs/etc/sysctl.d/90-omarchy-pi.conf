# Omarchy ARM64 Pi 5 sysctl tuning
# Omarchy upstream defaults, plus Pi-specific memory behavior (zram-heavy).

# Keep cgroup v2 hierarchy available for docker + systemd user slices
kernel.unprivileged_userns_clone = 1

# zram-friendly swappiness (fast "swap", avoid SD writes)
vm.swappiness = 180
vm.vfs_cache_pressure = 50
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Watchdog off (Pi has no reliable hw watchdog by default)
kernel.watchdog = 0

# Network buffers tuned for 1 GbE + WiFi
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Inotify limits (Quickshell/VSCodium file watching)
fs.inotify.max_user_watches = 524288
