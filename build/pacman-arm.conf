# pacman configuration used to populate the Omarchy ARM64 rootfs.
# Points at the Arch Linux ARM repositories (aarch64) instead of x86_64.
# Used by build/build-image.sh via `pacstrap -C build/pacman-arm.conf`.
#
# IMPORTANT: ALARM's repository layout differs from upstream Arch:
#   http://mirror.archlinuxarm.org/<$arch>/<repo>/   (e.g. /aarch64/core/)
# — NOT the x86 layout /$repo/os/$arch. Verified 2026-09-06 against
#   mirror.archlinuxarm.org (HTTP 302 -> regional mirrors, HTTP 200).
#
# SigLevel matches the ALARM docs; the ALARM signing key
# (68B3537F39A313B3E574D06777193F152BDBE6A6) is imported in the build
# container keyring (see build/Dockerfile) and copied into the target
# by pacstrap.

[options]
HoldPkg      = pacman glibc
Architecture = aarch64
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
